<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6c5ce7"><meta name="description" content="Word Adventure learning app for Grades 3-7"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>🌈 Word Adventure</title></head><body>
<header><div class="brand"><button id="menuBtn" class="menu-btn" type="button" aria-label="Open categories" aria-expanded="false" aria-controls="categoryMenu">☰</button><div><h1>🌈 Word Adventure</h1><p>Learn • Play • Read • Grow</p></div></div><button id="install" class="install">📲 Install App</button></header>
<section class="stats"><span>⭐ <b id="stars">0</b></span><span>🔥 <b id="streak">0</b></span><span>🏆 Level <b id="level">1</b></span><label>Grade <select id="grade"><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></label></section>
<div id="menuShade" class="menu-shade hidden" aria-hidden="true"></div><nav id="categoryMenu" aria-label="Learning categories"><button id="menuClose" class="menu-close" type="button" aria-label="Close categories">✕</button><button onclick="go('home')">🏠 Home</button><button onclick="go('learn')">📚 Learn</button><button onclick="go('spelling')">✏️ Spelling</button><button onclick="go('games')">🎮 Games</button><button onclick="go('stories')">📖 Stories</button><button onclick="go('maths')">➗ Maths</button><button onclick="go('time')">🕒 Time</button><button onclick="go('dictionary')">📕 Dictionary</button><button onclick="go('progress')">📊 Progress</button></nav>
<button id="backBtn" class="back-btn hidden" data-page="home" aria-label="Go back to Home">← Back to Home</button>
<main id="app"></main><div id="modal" class="modal hidden"><div class="pop"><div class="emoji">🎉✨🌟</div><h2 id="mt">Amazing!</h2><p id="mx"></p><button onclick="closePop()">Keep going 🚀</button></div></div><script src="app.js"></script></body></html>
